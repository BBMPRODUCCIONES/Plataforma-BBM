    <!-- Red de seguridad contra service workers viejos.
         Si el navegador no logra cargar el JS o el CSS de la app (tipico cuando
         una version cacheada apunta a archivos que ya no existen en el servidor),
         se desregistra el service worker, se vacian las caches y se recarga UNA
         sola vez. Sin esto el celular se queda en "No se puede acceder a este sitio". -->
    <script>
      (function () {
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return;
          try {
            if (sessionStorage.getItem('bbm_sw_reset')) return;
            sessionStorage.setItem('bbm_sw_reset', '1');
          } catch (err) { return; }
          var done = function () { location.reload(); };
          if (!('serviceWorker' in navigator)) { done(); return; }
          navigator.serviceWorker.getRegistrations()
            .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
            .then(function () {
              if (!window.caches) return null;
              return caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              });
            })
            .then(done, done);
        }, true);
      })();
    </script>

    <!-- OneSignal SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    
    <!-- Demo environment detection - change icons for demo -->
    <script>
      (function () {
        var hostname = window.location.hostname || '';
        var isDemo = hostname.includes('demo') || hostname.includes('develop') || hostname.includes('preview');

        if (!isDemo) return;

        // Update theme color for demo (purple)
        var themeMeta = document.getElementById('theme-color-meta');
        if (themeMeta) themeMeta.content = '#7c3aed';

        // Update apple touch icons for demo (iOS Add to Home Screen)
        var appleIcon = document.getElementById('apple-touch-icon');
        if (appleIcon) appleIcon.href = '/pwa-192x192-demo.png';

        var appleIcon192 = document.getElementById('apple-touch-icon-192');
        if (appleIcon192) appleIcon192.href = '/pwa-192x192-demo.png';

        var appleIcon512 = document.getElementById('apple-touch-icon-512');
        if (appleIcon512) appleIcon512.href = '/pwa-512x512-demo.png';

        // Update manifest for demo (Android/Chrome install icon)
        var manifestLink = document.querySelector('link[rel="manifest"]');
        if (manifestLink) {
          manifestLink.setAttribute('href', '/manifest-demo.json');
        } else {
          var link = document.createElement('link');
          link.rel = 'manifest';
          link.href = '/manifest-demo.json';
          document.head.appendChild(link);
        }

        // Update document title
        document.title = 'BBM Producciones (Demo)';
      })();
    </script>
